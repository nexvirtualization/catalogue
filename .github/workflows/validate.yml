name: Validate catalogue
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests
      - name: Check Compose configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from scripts.validate import REF
          for manifest in sorted(Path('apps').glob('*/nex.yaml')):
              env = dict(os.environ)
              for variable, default in REF.findall(manifest.read_text()):
                  env[variable] = default or '/tmp/catalogue-validation/' + variable.lower()
              subprocess.run(['docker', 'compose', '-f', str(manifest), 'config', '--quiet'], env=env, check=True)
          PY

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: catalogue-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish Nex catalogue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish.sh
