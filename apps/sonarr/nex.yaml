# SPDX-License-Identifier: AGPL-3.0-only
x-nex:
  name: Sonarr
  summary: Manage a standalone television collection
  description: >-
    Television library manager. For integrated downloads, select the same existing DATA folder on a share as the downloader, or use arr-suite.
  category: media
  website: https://sonarr.tv
  source: https://github.com/Sonarr/Sonarr
  license: GPL-3.0
  scalable: false
  tags: [tv, automation]
  options:
    PUID:
      label: User ID
      help: Numeric UID used by the application. Both storage and any imported files must be writable by this UID or the selected group.
    PGID:
      label: Group ID
      help: Numeric GID used by the application. Match the group allowed to write its storage; Nex does not grant these permissions automatically.
    TZ:
      label: Time zone
      help: IANA time zone name, such as Etc/UTC.
    PORT:
      label: Web port
      help: Published HTTP port. Set up application authentication before allowing other users to connect.
    CONFIG:
      label: Configuration
      help: Persistent settings, database and credentials at /config. Must be writable by the selected UID/GID; back up this folder.
    DATA:
      label: Library and downloads
      help: Media at /data; use /data/tv for the library and /data/downloads for imports. To share with another app, select the same existing folder on the same share. Must be writable by PUID/PGID.
services:
  sonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls4@sha256:673dc4609a5672bc8e46069c86ffcea283a86b48d34a6c93d8da8c24a1b87571
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
    ports:
      - "${PORT:-8989}:8989"
    volumes:
      - "${CONFIG}:/config"
      - "${DATA}:/data"
    deploy:
      replicas: 1
